name: Qualidade e capturas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
      - name: Testes browser e capturas
        run: npm run test:browser
      - name: Anexar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-escola
          path: docs/apresentacao/atualizadas/
          if-no-files-found: ignore
      - name: Anexar falhas do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
